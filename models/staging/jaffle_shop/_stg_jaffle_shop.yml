models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
        - accepted_values:
            arguments:
              values: ['completed', 'shipped', 'placed', 'return_pending', 'returned']

            # can slo be a list of names  like so 

            # values:
            # - completed
            # - returned

      - name: customer_id
        data_tests:
          - relationships:
             arguments: 
              field: customer_id
              to: ref('stg_jaffle_shop__customers')
 
      


